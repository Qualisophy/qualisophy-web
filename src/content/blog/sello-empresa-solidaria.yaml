# Nuestro compromiso social ya tiene sello: somos Empresa Solidaria
# URL: /blog/sello-empresa-solidaria (el nombre del fichero es la URL) · Esquema: src/content.config.ts

titulo: "Nuestro compromiso social ya tiene sello: somos Empresa Solidaria"
categoria: Noticias
fecha: 2026-10-13
imagen: ../../assets/blog/empresa-solidaria/empresa-solidaria-blog.png
resumen: Hemos obtenido el Sello Empresa Solidaria 2026 por destinar el 0,7 % de nuestro Impuesto de Sociedades a proyectos sociales.
migas: Sello Empresa Solidaria
contenido:
  intro: "En Qualisophy siempre hemos defendido que una empresa no se mide solo por sus resultados, sino también por el impacto que genera a su alrededor. Hoy damos un paso más en ese compromiso: hemos obtenido el Sello Empresa Solidaria 2026, que concede la Plataforma del Tercer Sector a las empresas que marcan la Casilla Empresa Solidaria en el Impuesto de Sociedades."
  insignia: ../../assets/blog/empresa-solidaria/empresa-solidaria-blog.png
  secciones:
    - titulo: ¿Qué es la Casilla Empresa Solidaria?
      parrafos:
        - "La Casilla Empresa Solidaria permite a las empresas destinar el 0,7 % de su Impuesto de Sociedades a financiar proyectos sociales. Es una decisión sencilla que se toma en el momento de presentar el impuesto y que no supone ningún coste adicional para la compañía: no se paga más ni se recibe menos devolución."
        - Ese 0,7 % se destina a programas de entidades del Tercer Sector que trabajan cada día con las personas y colectivos más vulnerables. El Sello Empresa Solidaria reconoce públicamente a las empresas que han dado ese paso.
      datoClave:
        titulo: Dato Clave
        texto: En 2025, la Casilla Empresa Solidaria recaudó cerca de 125 millones de euros para contribuir a una sociedad más justa e inclusiva.
    - titulo: Coherente con lo que somos
      parrafos:
        - Marcar esta casilla encaja de forma natural con nuestra misión. En Qualisophy trabajamos para abrir el sector tecnológico a personas neurodivergentes, del entorno rural, con talento migrante o en riesgo de exclusión, porque creemos que el talento está en todas partes y solo necesita una oportunidad.
        - "Sumarnos a esta iniciativa es otra forma de llevar esa convicción a la práctica: que una parte de nuestra contribución fiscal ayude a sostener proyectos sociales que comparten nuestro objetivo de construir una sociedad más justa."
    - titulo: Una invitación a otras empresas
      parrafos:
        - "Este sello no es solo un reconocimiento, también es una forma de dar visibilidad a una iniciativa que muchas empresas todavía no conocen. Si tu empresa quiere sumarse, estos son los motivos para hacerlo:"
      lista:
        - <strong>No tiene coste:</strong> Destinar el 0,7 % a fines sociales no aumenta la cuota del impuesto ni reduce la devolución.
        - <strong>Genera impacto real:</strong> Los fondos financian proyectos sociales de entidades del Tercer Sector que trabajan directamente con las personas.
        - <strong>Hace visible tu compromiso:</strong> El Sello Empresa Solidaria permite mostrar a clientes, equipo y sociedad que tu empresa apuesta por la responsabilidad social. Puedes solicitarlo en <a href="https://www.casillaempresasolidaria.es/sello-empresa-solidaria/" target="_blank" rel="noopener noreferrer" class="text-primary font-semibold underline">casillaempresasolidaria.es</a>.
      cierre: Porque cada empresa puede ser la pieza que completa una sociedad más inclusiva. En Qualisophy ya hemos marcado la casilla, ¿te sumas?
