resumen: Técnicas y mentalidad para integrarse en equipos ágiles Scrum/Kanban.
descripcion: En los entornos ágiles modernos, el testing ya no es una fase al final del proyecto, sino una actividad continua en la que participa todo el equipo. Este curso dota a los profesionales de QA de las técnicas y la mentalidad necesarias para integrarse en equipos Scrum/Kanban, aportando valor desde la creación de historias de usuario, automatizando estratégicamente y garantizando entregas rápidas y seguras.
requisitos: Experiencia en pruebas de software tradicionales y comprensión básica de marcos de trabajo ágiles (Scrum/Kanban).
