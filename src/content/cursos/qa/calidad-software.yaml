resumen: Verifica que las aplicaciones funcionan correctamente y valida requerimientos.
descripcion: El Testing es la parte del Desarrollo de Software que se encarga de verificar que las aplicaciones, servicios y soluciones informáticas funcionan correctamente, y validar que su cometido es el que requieren los usuarios. El Testing se engloba como una de las actividades principales dentro de la Calidad del Software, y con esta formación recibirás todo lo necesario para llevar a cabo esta actividad vital.
deQueTrata: La formación se compone de cinco módulos donde aprenderás todo lo necesario para realizar tanto Testing Funcional Manual cómo Automático aplicando las últimas tendencias de metodologías así como herramientas de IA. Practicarás todos los conceptos y tendrás acceso a todas las herramientas para llevar a cabo el aprendizaje.
salidasProfesionales: Las personas en los roles de Tester o QA (Quality Assurance) son los encargados de realizar las tareas relacionadas con el aseguramiento de la Calidad. Podrás acceder a nivel Junior de estos puestos de trabajo con la formación recibida.
requisitos: La formación está enfocada a personas con conocimientos básicos de herramientas de ofimática así como el uso del ordenador personal. El conocimiento de algún lenguaje de programación no es necesario pero sí recomendable. Especialmente dirigida a personas que quieren introducirse en el mundo del Testing o reciclar su profesión.
nivel: Principiante
