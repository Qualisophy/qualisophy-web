resumen: Domina la validación del backend integrándola en procesos CI/CD.
descripcion: En la arquitectura de software actual, las APIs son la columna vertebral de cualquier aplicación. Este curso está diseñado para dominar la validación del backend antes de que exista una interfaz gráfica, ahorrando tiempo y costes en el ciclo de desarrollo. Los alumnos aprenderán a utilizar Postman no solo como cliente HTTP, sino como una potente herramienta de automatización, validación de datos y monitorización, integrándola en procesos de integración continua (CI/CD).
requisitos: Conocimientos básicos de arquitectura web (HTML/JSON) y nociones fundamentales de QA. No se requiere experiencia previa en programación, aunque nociones de JavaScript son recomendables.
