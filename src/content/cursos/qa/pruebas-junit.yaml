resumen: Creación de pruebas robustas usando el estándar de la industria para Java.
descripcion: "La calidad del software comienza desde la línea de código más pequeña. Este curso profundiza en la creación de pruebas unitarias robustas utilizando el estándar de la industria para Java: JUnit. Los desarrolladores y QA técnicos aprenderán a crear código testeable, aplicar dobles de prueba y asegurar que los cambios de código futuros no rompan la funcionalidad existente, adoptando una cultura de Shift-Left Testing."
requisitos: Experiencia sólida en Programación Orientada a Objetos, preferiblemente en Java o lenguajes similares (C#, C++).
nivel: Avanzado
modalidad: Online
