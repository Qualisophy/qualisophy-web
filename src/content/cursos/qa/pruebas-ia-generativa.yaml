resumen: Acelera tus labores diarias de QA utilizando Inteligencia Artificial Generativa.
descripcion: "La Inteligencia Artificial Generativa (GenAI) está redefiniendo los límites de la ingeniería de calidad. Este curso de vanguardia capacita a los profesionales del testing en dos frentes cruciales: cómo utilizar la IA generativa para hiper-acelerar sus labores diarias de QA (creación de casos, generación de datos, automatización), y cómo abordar el desafío de testear sistemas que integran modelos de IA generativa en sus productos."
requisitos: Amplia experiencia en QA y diseño de pruebas. Conocimientos básicos sobre el funcionamiento de las IAs conversacionales.
