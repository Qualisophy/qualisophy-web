resumen: Inmersión completa en la cultura, prácticas y herramientas de DevOps.
descripcion: La filosofía DevOps ha transformado la manera en que se construye, prueba y despliega el software, rompiendo los silos tradicionales entre desarrollo y operaciones. Este curso proporciona una inmersión completa en la cultura, prácticas y herramientas de DevOps. Los alumnos aprenderán a automatizar procesos clave mediante pipelines de Integración y Despliegue Continuo (CI/CD), asegurando la calidad del producto en cada etapa gracias al Testing Continuo y la monitorización activa.
requisitos: Conocimientos básicos sobre el ciclo de vida del desarrollo de software (SDLC) y familiaridad general con conceptos de testing. Es recomendable tener nociones básicas de navegación por línea de comandos.
