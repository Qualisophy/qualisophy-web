resumen: Mejora radicalmente tu velocidad y organización corporativa diaria.
descripcion: Basado en los 6 módulos de estudio estandarizados, este curso ofrece una capacitación completa en las herramientas ofimáticas esenciales del mercado. El objetivo es que cualquier profesional mejore radicalmente su velocidad, organización y capacidad para generar documentos, presentar ideas y estructurar presupuestos o inventarios en el entorno corporativo, eliminando fricciones tecnológicas del día a día.
