resumen: Maneja grandes volúmenes de datos, macros y Power Pivot.
descripcion: Eleva tus habilidades ofimáticas al nivel experto. Este curso está diseñado para profesionales financieros, analistas y gestores que necesitan manejar grandes volúmenes de datos. Los estudiantes dominarán desde fórmulas condicionales complejas y matrices, hasta la automatización de procesos mediante macros y la transición hacia el modelado de datos avanzado integrado en el propio Excel (Power Pivot).
requisitos: Dominio sólido de funciones básicas/intermedias de Excel y manejo habitual de tablas de datos.
nivel: Avanzado
