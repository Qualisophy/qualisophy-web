  - heading "school ¿De qué trata esta formación?" [level=3]
  - paragraph: "Cambiar de sector no es fácil: muchas personas que saben testear o que vienen de otra área se quedan atascadas en los procesos de selección. El problema no suele ser la falta de capacidad, sino un CV que no destaca, un perfil de LinkedIn invisible para los reclutadores, la falta de un portfolio que demuestre lo que sabes y entrevistas para las que nadie te ha preparado."
  - paragraph: "En esta formación trabajamos esos cuatro pilares (CV estratégico, LinkedIn SEO, Portfolio QA y Entrevistas) en tres fases: Estrategia, Optimización y Acción. Con una clase online intensiva, una mentoría 1 a 1 y un simulacro de entrevista, sales con tu candidatura lista para optar a tu primer puesto en QA."
  - 'button "1 MÓDULO 1 Fase 1 · Estrategia: tu punto de partida"':
    - text: ""
    - heading "MÓDULO 1" [level=3]
    - paragraph: "Fase 1 · Estrategia: tu punto de partida"
  - paragraph: Definimos hacia dónde vas antes de tocar tu candidatura.
  - list:
