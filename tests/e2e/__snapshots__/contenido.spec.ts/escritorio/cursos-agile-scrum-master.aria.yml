  - heading "school ¿De qué trata esta formación?" [level=3]
  - paragraph: "La figura del Scrum Master hace referencia a un profesional especializado que facilita, asesora y mentoriza a los equipos de desarrollo de un producto o proyecto. Colabora estrechamente con la empresa para que mejoren de forma constante, consiguiendo así una entrega de valor sólida. Con este curso, los alumnos aprenderán el marco de trabajo de Scrum, junto con las herramientas y prácticas que harán al equipo y a la organización expertos en su objetivo principal: entregar valor."
  - button "1 MÓDULO 1 Introducción a Agile y Scrum":
    - text: ""
    - heading "MÓDULO 1" [level=3]
    - paragraph: Introducción a Agile y Scrum
  - paragraph: Comprende por qué la agilidad es vital hoy en día.
  - list:
    - listitem: Entender las bases de la agilidad y por qué surge en el desarrollo de proyectos complejos.
  - button "2 MÓDULO 2 Marco Scrum":
    - text: ""
