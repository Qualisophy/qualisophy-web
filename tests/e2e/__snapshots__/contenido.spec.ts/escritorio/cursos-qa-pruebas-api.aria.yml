  - heading "school ¿De qué trata esta formación?" [level=3]
  - paragraph: En la arquitectura de software actual, las APIs son la columna vertebral de cualquier aplicación. Este curso está diseñado para dominar la validación del backend antes de que exista una interfaz gráfica, ahorrando tiempo y costes en el ciclo de desarrollo. Los alumnos aprenderán a utilizar Postman no solo como cliente HTTP, sino como una potente herramienta de automatización, validación de datos y monitorización, integrándola en procesos de integración continua (CI/CD).
  - button "1 MÓDULO 1 Fundamentos de APIs y Entorno de Postman":
    - text: ""
    - heading "MÓDULO 1" [level=3]
    - paragraph: Fundamentos de APIs y Entorno de Postman
  - paragraph: Comprende la base de las comunicaciones web.
  - list:
    - listitem: Arquitectura cliente-servidor y verbos HTTP (GET, POST, PUT, DELETE).
    - listitem: "Estructura de peticiones: cabeceras, parámetros, body y códigos de estado."
    - listitem: Creación y gestión de Colecciones y Entornos en Postman.
  - button "2 MÓDULO 2 Scripting y Automatización de Validaciones":
    - text: ""
    - heading "MÓDULO 2" [level=3]
    - paragraph: Scripting y Automatización de Validaciones
  - paragraph: Usa código para automatizar tus pruebas de API.
  - list:
    - listitem: Uso de Tests y Pre-request scripts en JavaScript.
    - listitem: Validación de esquemas JSON y extracción de variables dinámicas.
    - listitem: Uso de aserciones avanzadas (Chai Assertion Library).
  - button "3 MÓDULO 3 Estrategia, Datos y Estructuración":
    - text: ""
    - heading "MÓDULO 3" [level=3]
    - paragraph: Estrategia, Datos y Estructuración
  - paragraph: Diseña pruebas robustas y mantenibles.
  - list:
    - listitem: Pruebas basadas en datos (Data-Driven Testing) usando archivos CSV y JSON.
    - listitem: Flujos de trabajo avanzados (Postman Flows) y encadenamiento de peticiones.
    - listitem: Estrategias de nomenclatura y mantenimiento de suites escalables.
  - button "4 MÓDULO 4 Colaboración y CI/CD con Newman":
    - text: ""
    - heading "MÓDULO 4" [level=3]
    - paragraph: Colaboración y CI/CD con Newman
  - paragraph: Ejecuta tus colecciones de Postman en la nube.
  - list:
    - listitem: Espacios de trabajo compartidos y control de versiones de colecciones.
    - listitem: Ejecución de pruebas por línea de comandos utilizando Newman.
    - listitem: Integración de pruebas automatizadas en pipelines de CI/CD (Jenkins, GitLab CI).
  - heading "info Requisitos previos" [level=3]
  - paragraph: Conocimientos básicos de arquitectura web (HTML/JSON) y nociones fundamentales de QA. No se requiere experiencia previa en programación, aunque nociones de JavaScript son recomendables.
  - button "Me interesa"