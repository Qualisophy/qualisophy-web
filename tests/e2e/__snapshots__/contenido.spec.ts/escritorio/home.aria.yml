  - 'heading "Misión: Diversidad en el Sector IT" [level=2]'
  - paragraph: Nuestra misión es democratizar el acceso a la tecnología. Diseñamos e impartimos programas formativos adaptados para la integración sociolaboral de personas neurodivergentes, talento rural y colectivos vulnerables. A través de nuestra investigación (I+D+i) en Inteligencia Artificial, personalizamos el aprendizaje y ofrecemos Consultoría de Talento como Servicio (TaaS) para impulsar la competitividad corporativa.
