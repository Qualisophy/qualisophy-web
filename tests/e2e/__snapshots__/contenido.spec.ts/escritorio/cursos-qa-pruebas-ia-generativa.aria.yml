  - heading "school ¿De qué trata esta formación?" [level=3]
  - paragraph: "La Inteligencia Artificial Generativa (GenAI) está redefiniendo los límites de la ingeniería de calidad. Este curso de vanguardia capacita a los profesionales del testing en dos frentes cruciales: cómo utilizar la IA generativa para hiper-acelerar sus labores diarias de QA (creación de casos, generación de datos, automatización), y cómo abordar el desafío de testear sistemas que integran modelos de IA generativa en sus productos."
  - button "1 MÓDULO 1 Fundamentos de IA Generativa para QA":
    - text: ""
    - heading "MÓDULO 1" [level=3]
    - paragraph: Fundamentos de IA Generativa para QA
  - paragraph: Comprendiendo la base tecnológica de GenAI.
  - list:
    - listitem: Qué es la IA Generativa y cómo funcionan los Grandes Modelos de Lenguaje (LLMs).
    - listitem: "Prompt Engineering aplicado a QA: contexto, instrucciones, formato y ejemplos."
    - listitem: "Limitaciones intrínsecas: determinismo vs. probabilismo, alucinaciones y contexto."
  - button "2 MÓDULO 2 Aceleración del Testing utilizando GenAI":
    - text: ""
    - heading "MÓDULO 2" [level=3]
    - paragraph: Aceleración del Testing utilizando GenAI
  - paragraph: Aplica la IA a la creación de tus activos de QA.
  - list:
    - listitem: Generación automática de Casos de Prueba y Criterios de Aceptación.
    - listitem: Creación sintética de Datos de Prueba masivos y escenarios de frontera.
    - listitem: "Asistencia en automatización de código: revisión de scripts y análisis de logs de errores."
  - button "3 MÓDULO 3 Pruebas sobre Sistemas Basados en IA":
    - text: ""
    - heading "MÓDULO 3" [level=3]
    - paragraph: Pruebas sobre Sistemas Basados en IA
  - paragraph: El desafío de testear sistemas con IA integrada.
  - list:
    - listitem: Estrategias para probar aplicaciones que integran LLMs (Chatbots).
    - listitem: Evaluación de la precisión, coherencia y relevancia de los resultados generados.
    - listitem: Pruebas de seguridad específicas (e.g., Prompt Injection, manipulación de inputs).
  - button "4 MÓDULO 4 Ética, Sesgos y Gestión de Riesgos":
