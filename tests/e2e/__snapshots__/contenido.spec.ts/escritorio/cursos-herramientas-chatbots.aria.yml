  - heading "school ¿De qué trata esta formación?" [level=3]
  - paragraph: En la era digital actual, la inmediatez es clave. Los chatbots son una herramienta poderosa que permite a los comercios automatizar tareas repetitivas, mejorar drásticamente la atención al cliente y optimizar la experiencia general del usuario. En este curso, los alumnos aprenderán a diseñar, crear e integrar asistentes virtuales conversacionales para aumentar la eficiencia de su negocio.
  - button "1 MÓDULO 1 ¿Qué son los Chatbots?":
